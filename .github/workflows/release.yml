name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$RELEASE_TAG" == "v$version" ]]
          test -f "docs/releases/$version.md"
      - name: Build and verify DMG
        run: |
          ./build.sh
          ./package.sh
          python3 Scripts/verify-package.py
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(cat VERSION)"
          dmg="dist/Launchpad-Studio-$version-universal.dmg"
          if gh release view "$RELEASE_TAG" --json isDraft > .build/release-state.json; then
            python3 -c 'import json; assert json.load(open(".build/release-state.json"))["isDraft"], "Refusing to overwrite a published release"'
            gh release upload "$RELEASE_TAG" "$dmg" "$dmg.sha256" --clobber
            gh release edit "$RELEASE_TAG" --title "$version" --notes-file "docs/releases/$version.md"
          else
            gh release create "$RELEASE_TAG" "$dmg" "$dmg.sha256" --verify-tag --draft \
              --title "$version" --notes-file "docs/releases/$version.md"
          fi
