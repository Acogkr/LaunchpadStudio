name: Bug report
description: Something did not work as expected.
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: '1.0 (32)'
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.7.4, Apple M1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the steps that reproduce it and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message or screenshot
      description: Remove personal information. Please do not attach Launchpad databases or backups.
